name: FabTrace release review
on:
  push:
    branches: [codex/fabtrace-spool-records-20261103]
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create exact source snapshot for isolated validation
        run: git archive --format=zip --output=fabtrace-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fabtrace-review-source
          path: fabtrace-source.zip
          retention-days: 2
          if-no-files-found: error
