name: FabTrace release review
on:
  push:
    branches: [codex/fabtrace-spool-records-20261103]
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Package missing local validation dependency
        run: |
          mkdir -p review-dependencies
          python -m pip download --no-deps 'pwdlib==0.3.0' -d review-dependencies
          git archive --format=zip --output=fabtrace-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fabtrace-review-source
          path: |
            fabtrace-source.zip
            review-dependencies/
          retention-days: 2
          if-no-files-found: error
